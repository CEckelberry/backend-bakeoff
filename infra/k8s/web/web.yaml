apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bakeoff
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      tolerations:
        - effect: NoSchedule
          key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
      containers:
        - name: web
          image: us-west1-docker.pkg.dev/exalted-kit-496514-s1/portfolio/bakeoff-web:d2cf2914
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: RESULTS_API_URL
              value: "http://results-api:8080"
            - name: ROUTER_URL
              value: "http://router:8080"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bakeoff
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
