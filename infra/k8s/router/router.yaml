apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  namespace: bakeoff
data:
  nginx.conf: |
    events { worker_connections 1024; }

    http {
      resolver 34.118.224.10 valid=10s;

      map $http_x_runtime $backend {
        "go"     "bo-go.bakeoff.svc.cluster.local:8080";
        "rust"   "bo-rust.bakeoff.svc.cluster.local:8080";
        "rails"  "bo-rails.bakeoff.svc.cluster.local:8080";
        "node"   "bo-node.bakeoff.svc.cluster.local:8080";
        "python" "bo-python.bakeoff.svc.cluster.local:8080";
        "php"    "bo-php.bakeoff.svc.cluster.local:8086";
        default  "bo-go.bakeoff.svc.cluster.local:8080";
      }

      server {
        listen 8080;

        location /health {
          return 200 '{"status":"ok"}';
          add_header Content-Type application/json;
        }

        location / {
          proxy_pass http://$backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Runtime $http_x_runtime;
          proxy_read_timeout 30s;
          proxy_connect_timeout 5s;
          add_header Access-Control-Allow-Origin *;
          add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
          add_header Access-Control-Allow-Headers "Content-Type, X-Runtime";
          if ($request_method = OPTIONS) {
            return 204;
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: bakeoff
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      tolerations:
        - effect: NoSchedule
          key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
      containers:
        - name: router
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: router-config
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: bakeoff
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - port: 8080
      targetPort: 8080
