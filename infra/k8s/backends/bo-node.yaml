apiVersion: apps/v1
kind: Deployment
metadata:
  name: bo-node
  namespace: bakeoff
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: bo-node
  template:
    metadata:
      labels:
        app: bo-node
        runtime: node
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      tolerations:
        - effect: NoSchedule
          key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
      serviceAccountName: bakeoff-workload
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          restartPolicy: Always
          args:
            - "--structured-logs"
            - "--port=5432"
            - "exalted-kit-496514-s1:us-west1:portfolio-db"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
        - name: wait-for-proxy
          image: busybox
          command: ['sh', '-c', 'until nc -z 127.0.0.1 5432; do sleep 1; done']
      containers:
        - name: bo-node
          image: us-west1-docker.pkg.dev/exalted-kit-496514-s1/portfolio/bakeoff-node:d2cf2914
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bakeoff-db
                  key: password
            - name: DATABASE_URL
              value: "postgresql://bakeoff:$(DB_PASSWORD)@127.0.0.1:5432/bakeoff?search_path=bakeoff_node"
            - name: RUNTIME_NAME
              value: "node"
            - name: TAX_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: TAX_SERVICE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: LOG_LEVEL
            - name: LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: LISTEN_ADDR
            - name: LISTEN_PORT
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: LISTEN_PORT
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bo-node
  namespace: bakeoff
spec:
  selector:
    app: bo-node
  ports:
    - port: 8080
      targetPort: 8080
