apiVersion: apps/v1
kind: Deployment
metadata:
  name: bo-rails
  namespace: bakeoff
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: bo-rails
  template:
    metadata:
      labels:
        app: bo-rails
        runtime: rails
    spec:
      serviceAccountName: bakeoff-workload
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          restartPolicy: Always
          args:
            - "--structured-logs"
            - "--port=5432"
            - "exalted-kit-496514-s1:us-west1:portfolio-db"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
        - name: wait-for-proxy
          image: busybox
          command: ['sh', '-c', 'until nc -z 127.0.0.1 5432; do sleep 1; done']
      containers:
        - name: bo-rails
          image: us-west1-docker.pkg.dev/exalted-kit-496514-s1/portfolio/bakeoff-rails:7bd703d6
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bakeoff-db
                  key: password
            - name: DATABASE_URL
              value: "postgresql://bakeoff:$(DB_PASSWORD)@127.0.0.1:5432/bakeoff?search_path=bakeoff_rails"
            - name: RUNTIME_NAME
              value: "rails"
            - name: TAX_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: TAX_SERVICE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: LOG_LEVEL
            - name: RAILS_ENV
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: RAILS_ENV
            - name: RAILS_LOG_TO_STDOUT
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: RAILS_LOG_TO_STDOUT
            - name: RAILS_MAX_THREADS
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: RAILS_MAX_THREADS
            - name: WEB_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: WEB_CONCURRENCY
            - name: SECRET_KEY_BASE
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: SECRET_KEY_BASE
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bo-rails
  namespace: bakeoff
spec:
  selector:
    app: bo-rails
  ports:
    - port: 8080
      targetPort: 8080
