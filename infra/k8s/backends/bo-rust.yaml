apiVersion: apps/v1
kind: Deployment
metadata:
  name: bo-rust
  namespace: bakeoff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bo-rust
  template:
    metadata:
      labels:
        app: bo-rust
        runtime: rust
    spec:
      serviceAccountName: bakeoff-workload
      containers:
        - name: bo-rust
          image: us-west1-docker.pkg.dev/exalted-kit-496514-s1/portfolio/bakeoff-rust:a5466920
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bakeoff-db
                  key: password
            - name: DATABASE_URL
              value: "postgresql://bakeoff:$(DB_PASSWORD)@127.0.0.1:5432/bakeoff?search_path=bakeoff_rust"
            - name: RUNTIME_NAME
              value: "rust"
            - name: TAX_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: TAX_SERVICE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: bakeoff-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          imagePullPolicy: Always
          args:
            - "--structured-logs"
            - "--port=5432"
            - "exalted-kit-496514-s1:us-west1:portfolio-db"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bo-rust
  namespace: bakeoff
spec:
  selector:
    app: bo-rust
  ports:
    - port: 8080
      targetPort: 8080
