apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: bakeoff
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 3s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'backends'
        static_configs:
          - targets:
              - 'bo-go:8080'
              - 'bo-rust:8080'
              - 'bo-rails:8080'
              - 'bo-node:8080'
              - 'bo-python:8080'
              - 'bo-php:8086'
              - 'tax-service:8080'
              - 'results-api:8080'
            labels:
              group: 'backend'

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: bakeoff
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      tolerations:
        - effect: NoSchedule
          key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: bakeoff
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
